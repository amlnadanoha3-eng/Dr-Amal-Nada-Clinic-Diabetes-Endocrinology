<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>د. [الاسم الكامل] | استشارية السكري والغدد الصماء</title>
<meta name="description" content="عيادة متخصصة في السكري والغدد الصماء.">
<meta property="og:type" content="website"><meta property="og:title" content="د. [الاسم الكامل] | السكري والغدد الصماء">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0b3b66;--teal:#14a3a8;--soft:#e8f6f6;--tq:#2ec4c0;--ink:#1d2b3a;--mut:#5b6b7b;--sh:0 10px 30px rgba(11,59,102,.08)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:Cairo,Tahoma,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.8}
a{color:inherit;text-decoration:none}.w{max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #e6eef2}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.brand b{display:block;color:var(--blue);font-weight:800;line-height:1.3}.brand small{color:var(--teal);font-size:.8rem}
nav{display:none;gap:22px;font-weight:600;color:var(--mut)}nav a:hover{color:var(--teal)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:999px;font-weight:700;border:0;cursor:pointer;font:inherit;font-weight:700;transition:.25s}
.wa{background:linear-gradient(135deg,var(--teal),var(--tq));color:#fff;box-shadow:0 8px 20px rgba(20,163,168,.35)}.wa:hover{transform:translateY(-2px)}
.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.ghost:hover{background:var(--blue);color:#fff}
.sm{padding:8px 16px;font-size:.9rem}
.hero{background:radial-gradient(circle at 80% 10%,var(--soft),#fff 60%);padding:56px 0}
.hg{display:grid;gap:40px;align-items:center}
h1{font-size:clamp(1.9rem,5vw,3.2rem);line-height:1.4;color:var(--blue);font-weight:800}
.hero p{color:var(--mut);font-size:1.1rem;margin:16px 0 28px;max-width:520px}.btns{display:flex;flex-wrap:wrap;gap:12px}
.ph{aspect-ratio:4/5;max-width:380px;margin:auto;border-radius:32px;background:linear-gradient(160deg,var(--soft),#cfeeee);box-shadow:var(--sh);display:grid;place-items:center;overflow:hidden;position:relative;text-align:center;color:var(--teal)}
.ph img{width:100%;height:100%;object-fit:cover}.ph small{position:absolute;bottom:16px;inset-inline:0;color:var(--mut)}
section{padding:72px 0}.alt{background:#f6fbfb}
h2{font-size:clamp(1.6rem,3.5vw,2.2rem);color:var(--blue);font-weight:800;text-align:center}
.lead{text-align:center;color:var(--mut);margin:6px 0 40px}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:26px;border:1px solid #eaf2f4;transition:.3s}.card:hover{transform:translateY(-4px)}
.grid{display:grid;gap:22px}
.ic{width:54px;height:54px;border-radius:16px;background:var(--soft);color:var(--teal);display:grid;place-items:center;margin-bottom:14px}
.ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{color:var(--blue);font-size:1.15rem;margin-bottom:8px}
.card ul{list-style:none;padding:0;color:var(--mut)}.card li:before{content:"•";color:var(--tq);margin-inline-end:8px;font-weight:800}
.fact{padding:14px 0;border-bottom:1px solid #e6eef2}.fact span{display:block;color:var(--teal);font-weight:700;font-size:.9rem}
.why{display:flex;align-items:center;gap:14px;font-weight:700;color:var(--blue)}.why i{flex:none;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-style:normal}
.art .tag{height:110px;border-radius:14px;background:linear-gradient(135deg,var(--soft),#bfe9e8);margin-bottom:14px}.art a{color:var(--teal);font-weight:700}
.cta{background:linear-gradient(135deg,var(--blue),#0e5a8a);color:#fff;border-radius:28px;padding:40px 24px;text-align:center}
.cta h2{color:#fff}.cta .lead{color:#cfe6ee}.cinfo{display:grid;gap:14px;margin:28px 0;text-align:start}
.cinfo div{background:rgba(255,255,255,.1);border-radius:16px;padding:14px 18px}.cinfo span{display:block;color:var(--tq);font-size:.85rem;font-weight:700}
iframe{width:100%;height:260px;border:0;border-radius:18px;margin-top:20px}
details{background:#fff;border-radius:16px;box-shadow:var(--sh);margin-bottom:12px;padding:4px 20px;border:1px solid #eaf2f4}
summary{cursor:pointer;padding:14px 0;font-weight:700;color:var(--blue);list-style:none;display:flex;justify-content:space-between;gap:12px}
summary:after{content:"+";color:var(--teal);font-size:1.4rem}details[open] summary:after{content:"−"}details p{padding-bottom:14px;color:var(--mut)}
footer{background:#08294a;color:#c9d8e6;padding:48px 0 24px}.fg{display:grid;gap:28px}footer h4{color:#fff;margin-bottom:8px}
footer a:hover{color:var(--tq)}.dis{border-top:1px solid #1c4468;margin-top:28px;padding-top:18px;font-size:.85rem;color:#9fb6cb}
.fab{position:fixed;bottom:18px;inset-inline-start:18px;z-index:60;width:56px;height:56px;border-radius:50%;padding:0;justify-content:center}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(min-width:760px){nav{display:flex}.hg{grid-template-columns:1.2fr .8fr}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.cinfo{grid-template-columns:repeat(3,1fr)}.fg{grid-template-columns:2fr 1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
